[package]
name = "yoru"
version = "0.5.0"
description = "Yoru — SSH & Server Manager"
authors = ["yoru"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "yoru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
keyring = { version = "3.6.3", features = ["windows-native"] }
log = "0.4.35"
portable-pty = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# `ring` crypto backend: builds with plain MSVC (no CMake/NASM needed).
russh = { version = "0.63.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = "2.12.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs", "process"] }
trash = "5.2.9"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
uuid = { version = "1.26.1", features = ["v4"] }
zeroize = "1.9.1"
